openapi: 3.0.1
info:
  title: Attribute Toolbox SaaS
  description:
    "ATB Web Service is the real time processing of requests by the ATB\
    \ calculation engine via an API call. \n Clients can send real time requests to\
    \ the ATB calculation engine and receive attributes caluclation by their given deployment. \n Clients\
    \ can choose from pre-configured systems containing subsets of premier attributes\
    \ or use \n their own systems containing their custom attributes. \n For example\
    \ Auto, Student Loan, Retail, etc. \n This allows Fintech, Preferred and Credit\
    \ Unions clients the opportunity to access the premier attributes \n while reducing\
    \ delivery cost and version control. Clients provide their own credit reports\
    \ or request ATB to pull the reports. \n \n The Data Access API allows clients\
    \ to access data via an API. This API will return ARF data given parsed input data. It will also return ARF data\ during attribute calculations if parsed data is used as input. \n Data Access API supports\
    \ following data sources: \n - Experian Consumer V7 \n - Equifax Consumer US V5\
    \ & Equifax Consumer US V6 \n - TransUnion Consumer US V4.0 & TransUnion Consumer\
    \ US V4.1 \n - Dunn and Bradstreet Toolkit USV0 XML"
  contact:
    name: Attribute-Toolbox-SaaS
    email: AttributeToolbox@experian.com
  version: 2.0.0
servers:
  - url: https://sandbox-us-api.experian.com/decisionanalytics/atb
paths:
  /v2/data:
    post:
      description: >-
        Calls ATB Engine to get ARF data from the given Data Source based on the inputs provided
      tags:
        - Data Access
      summary: Gets data from the given datasource using the requested input fields.
      operationId: getData
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallDataSource"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DatasourceResponse"
                  - $ref: "#/components/schemas/DatasourceResponseOffline"
        "500":
          description: "An error occurred, please contact administrator for detail."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - security_auth: []
  /v2/attributes:
    post:
      description: >-
        Calls ATB Engine to perform attribute calculations based on incoming data.  The results are returned via response data.  This will also return ARF data if the given request contains parsed data as input instead of raw data
      tags:
        - Decisioning
      summary: Calculates the Attributes inside the given system
      operationId: getCalculate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallATBRequestTypeVectorNew"
            examples:
              Single Request Single Applicant With Data Access:
                $ref: "#/components/schemas/CallDataSource"
              Single Request Single Applicant Without Data Access:
                $ref: "#/components/examples/SingleRequestSingleApplicant"
              Single Request Multi Applicant Without Data Access:
                "$ref": "#/components/examples/SingleRequestMultiApplicant"
              Multi Request Single Applicant Without Data Access:
                "$ref": "#/components/examples/MultiRequestSingleApplicant"
              Multi Request Multi Applicant Without Data Access:
                "$ref": "#/components/examples/MultiRequestMultiApplicant"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResponse"
        "500":
          description: "An error occurred, please contact administrator for detail."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - security_auth: []
  /v1/attributes:
    post:
      deprecated: true
      operationId: attributes
      summary: Attribute calculation request / response
      description: >-
        Calls ATB Engine to perform attribute calculations based on incoming data. The results are returned via response data.
      tags:
        - Decisioning
      requestBody:
        required: true
        description: >-
          Basic attribute data to be submitted to the ATB Engine for calculation
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RequestPayload"
            examples:
              Single Request Single Applicant:
                "$ref": "#/components/examples/SingleRequestSingleApplicant"
              Single Request Multi Applicant:
                "$ref": "#/components/examples/SingleRequestMultiApplicant"
              Multi Request Single Applicant:
                "$ref": "#/components/examples/MultiRequestSingleApplicant"
              Multi Request Multi Applicant:
                "$ref": "#/components/examples/MultiRequestMultiApplicant"
      responses:
        "200":
          description: A successful calculation
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/EngineResponse"
              example:
                return:
                  response:
                    - system:
                      name: "Demo:Demo_Attributes:Sample_Attributes"
                      attributes: "ATT005,ATT074,ATT103,ATT134,ATT143,ATT152,ATT720,BAT804,DS_ERR,HIT_NOHIT,ROLL_OVER,RRT005,RRT081,RRT905,RTV403,THIN_FILE\n\"12\",\"0\",\"150\",\"5\",\"4\",\"9\",\"nil\",\"2\",\"0\",\"0\",\"0\",\"1\",\"0\",\"0\",\"48.08\",\"0\""
                      code: "0"
                      message: ""
                      datasourceName: "ExpConsUSV7"
                  customerTransactionId: "435"
        "400":
          description: Bad Request - Invalid/Missing Parameters or Invalid Characters in Request Value
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                errors:
                  - errorCode: "EXP-400"
                    errorType: "Bad Request"
                    message: "Malformed JSON Payload"
                success: false
        401:
          description: Unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                errors:
                  - errorCode: "EXP-401"
                    errorType: "Unauthorized"
                    message: "Access token is invalid"
                success: false
        404:
          description: Not Found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                errors:
                  - errorCode: "EXP-404"
                    errorType: "Not Found"
                    message: "Resource not found"
                success: false
        429:
          description: Too Many Requests
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                errors:
                  - errorCode: "EXP-429"
                    errorType: "Too Many Requests"
                    message: "Too many requests have been received in a given time frame"
                success: false
        500:
          description: Internal Server Error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                errors:
                  - errorCode: "EXP-500"
                    errorType: "Server Error"
                    message: "ATB Web service returned an exception. Please ontact Administrator for details."
                success: false
      security:
        - security_auth: []
components:
  examples:
   
    SingleRequestSingleApplicant:
      value:
        customerTransactionId: "435"
        requests:
          - datasources:
              - applicants:
                  - raw: ""
                name: "ExpConsUSV7"
            system:
              - systemName: "Demo:Demo_Attributes:Sample_Attributes"
    SingleRequestMultiApplicant:
      value:
        customerTransactionId: "435"
        requests:
          - datasources:
              - applicants:
                  - raw: ""
                  - raw: ""
                  - raw: ""
                  - raw: ""
                name: "ExpConsUSV7"
            system:
              - systemName: "Demo:Demo_Attributes:Sample_Attributes"
    MultiRequestSingleApplicant:
      value:
        customerTransactionId: "435"
        requests:
          - datasources:
              - applicants:
                  - raw: ""
                name: "ExpConsUSV7"
            system:
              - systemName: "Demo:Demo_Attributes:Sample_Attributes"
          - datasources:
              - applicants:
                  - raw: ""
                name: "EquConsUSV5"
            system:
              - systemName: "Demo:Demo_Attributes:Sample_Attributes"
    MultiRequestMultiApplicant:
      value:
        customerTransactionId: "435"
        requests:
          - datasources:
              - applicants:
                  - raw: ""
                  - raw: ""
                name: "ExpConsUSV7"
            system:
              - systemName: "Demo:Demo_Attributes:Sample_Attributes"
          - datasources:
              - applicants:
                  - raw: ""
                  - raw: ""
                name: "EquConsUSV5"
            system:
              - systemName: "Demo:Demo_Attributes:Sample_Attributes"
  schemas:
    DatasourceResponse:
      type: object
      properties:
        customerTransactionId:
          description: Optional client maintained transaction id
          type: string
          default: "435"
        result:
          type: array
          items:
            type: string
            format: byte
            default: 
    DatasourceResponseOffline:
      type: object
      properties:
        customerTransactionId:
          description: Optional client maintained transaction id
          type: string
          default: "435"
        data:
          type: array
          items:
            type: string
            format: byte
            default: 
    ErrorMessage:
      required:
        - error
        - message
      type: object
      properties:
        error:
          type: object
        message:
          type: string
          example: error
    ErrorResponse:
      required:
        - errors
        - message
        - status
      type: object
      properties:
        message:
          type: string
          example: Internal Server Error
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorMessage"
        status:
          type: string
          example: Failure
    CallDataSource:
      required:
        - datasourceName
        - inputs
      type: object
      properties:
        datasourceName:
          type: string
          xml:
            name: datasource_name
          default: ExpConsUSV7
        inputs:
          $ref: "#/components/schemas/DataSourceInputTypeVector"
        customerTransactionId:
          description: Optional client maintained transaction id
          type: string
          default: "435"
      xml:
        name: callDataSource
        namespace: urn:ATBWebService
    DataSourceInputType:
      required:
        - name
        - value
      type: object
      properties:
        name:
          type: string
          default: address_type
        value:
          type: string
          default: ST
    DataSourceInputTypeVector:
      type: object
      properties:
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceInputType"
    ApplicantDTO:
      type: object
      properties:
        applicant:
          type: string
        individual:
          type: string
        datasourceSegments:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceSegmentDTO"
    Calculation:
      type: object
      properties:
        systems:
          type: array
          items:
            $ref: "#/components/schemas/SystemDTO"
        pulledData:
          type: array
          items:
            $ref: "#/components/schemas/PulledData"
    CalculationResponse:
      type: object
      properties:
        customerTransactionId:
          description: Optional client maintained transaction id
          type: string
          default: "435"
        calculation:
          $ref: "#/components/schemas/CalculationTransaction"
    CalculationTransaction:
      type: object
      properties:
        transactionId:
          type: integer
        response:
          type: array
          items:
            $ref: "#/components/schemas/Calculation"
    DataDTO:
      type: object
      properties:
        datasourceName:
          type: string
          default: "ExpConsUSV7"
        reference:
          type: integer
        data:
          type: array
          items:
            type: string
            format: byte
            default: "RXhwQ29uc1VTVjcgRkFLRSBEQVRBIFRISVMgUkFXIERBVEEgV0lMTCBCRSBXSEFUIE5FRURTIFRPIEJFIFNFTlQgRk9SIENBTENVTEFUSU9OUy4gVEhJUyBJUyBGQUtFIERBVEEuIERPIE5PVCBVU0UgVEhJUyBSQVcgREFUQSBESVJFQ1RMWSBGT1IgVEhFIEVOR0lORQ=="
        code:
          type: integer
          format: int32
        message:
          type: string
        rolloverAttributes:
          type: string
    DatasourceSegmentDTO:
      type: object
      properties:
        name:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SegmentDTO"
    PulledData:
      type: object
      properties:
        applicant:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataDTO"
    SegmentDTO:
      type: object
      properties:
        name:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SegmentFieldDTO"
    SegmentFieldDTO:
      type: object
      properties:
        name:
          type: string
        values:
          type: array
          items:
            type: string
    SystemDTO:
      type: object
      properties:
        name:
          type: string
          default: "Demo:Demo_Attributes:Sample_Attributes"
        applicantData:
          type: array
          items:
            $ref: "#/components/schemas/ApplicantDTO"
        attributes:
          type: string
          default: 'ATT005,ATT074,ATT103,ATT134,ATT143,ATT152,ATT720,BAT804,DS_ERR,HIT_NOHIT,ROLL_OVER,RRT005,RRT081,RRT905,RTV403,THIN_FILE\n\"999\",\"9\",\"999\",\"9\",\"9\",\"99\",\"nil\",\"9\",\"9\",\"9\",\"9\",\"9\",\"9\",\"9\",\"98.98\",\"9\"'
        code:
          type: integer
          format: int32
        message:
          type: string
    ApplicantType:
      required:
        - applicants
      type: object
      properties:
        applicants:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceType"
        name:
          type: string
          default: "ExpConsUSV7"
    CallATBRequestTypeNew:
      required:
        - datasources
      type: object
      properties:
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ApplicantType"
        system:
          type: array
          items:
            $ref: "#/components/schemas/CallATBSystemType"
        profileName:
          type: string
          default: "profile_1"
          xml:
            name: profile_name
    CallATBRequestTypeVectorNew:
      required:
        - requests
      type: object
      properties:
        customerTransactionId:
          description: Optional client maintained transaction id
          type: string
          default: "435"  
        requests:
          type: array
          items:
            $ref: "#/components/schemas/CallATBRequestTypeNew"
    CallATBSystemType:
      type: object
      properties:
        systemName:
          type: string
          default: "Demo:Demo_Attributes:Sample_Attributes"
          xml:
            name: system_name
        attributes:
          type: array
          items:
            type: string
            default: "ATT005,ATT074,ATT103,ATT134,ATT143,ATT152,ATT720,BAT804,DS_ERR,HIT_NOHIT,ROLL_OVER,RRT005,RRT081,RRT905,RTV403,THIN_FILE"
        datasourceSegments:
          type: array
          xml:
            name: datasource_segments
          items:
            $ref: "#/components/schemas/DatasourceSegmentsInputType"
    DatasourceSegmentsInputType:
      required:
        - name
        - segments
      type: object
      properties:
        name:
          type: string
          default: "ExpConsUSV7"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SegmentInputType"
    DatasourceType:
      type: object
      properties:
        datasourceInputs:
          type: array
          xml:
            name: datasource_inputs
          items:
            $ref: "#/components/schemas/DataSourceInputType"
    SegmentInputType:
      required:
        - fields
        - name
      type: object
      properties:
        name:
          type: string
          default: "357"
        fields:
          type: array
          items:
            type: string
            default: "tr_terms"
    DatasourceArray:
      type: array
      description: An array of datasource objects for a single request
      items:
        $ref: "#/components/schemas/DatasourceObject"
    DatasourceObject:
      type: object
      required:
        - applicants
        - name
      properties:
        applicants:
          type: array
          description: Applicants array with up to ten applicants
          items:
            $ref: "#/components/schemas/ApplicantObjects"
        name:
          type: string
          description: Datasource to use. Will only accept upper/lower case characters (a-z, A-Z), numerics (0-9), and underscores (_)
          default: ExpConsUSV7
    RequestObject:
      type: object
      required:
        - datasources
        - system
      description: Request object that contains all the neccessary data for a single request with multiple applicants.
      properties:
        datasources:
          $ref: "#/components/schemas/DatasourceArray"
        system:
          $ref: "#/components/schemas/SystemArray"
    RequestArray:
      type: array
      description: An array of request objects required for multiple requests in a single transaction with any from 1 to 4 requests that contain a maximum of 10 total applicants.
      items:
        $ref: "#/components/schemas/RequestObject"
    RequestPayload:
      required:
        - requests
      properties:
        customerTransactionId:
          description: Optional client maintained transaction id
          type: string
          default: "435"
        requests:
          $ref: "#/components/schemas/RequestArray"
    SystemResponse:
      type: object
      properties:
        name:
          type: string
          description: System used in calculation
          default: Demo:Demo_Attributes:Sample_Attributes
        attributes:
          type: string
          description: CSV formated string with escaped attributes
          default: Attributes to be returned
        code:
          type: string
          description: Error code if error is present in Engine
          default: 0
        message:
          type: string
          default: Error Message
          description: Error message in Engine if code is not zero
        datasourceName:
          type: string
          description: Datasource used in calculations
          default: ExpConsUSV7
    EngineResponse:
      type: object
      properties:
        return:
          type: object
          properties:
            response:
              type: array
              items:
                properties:
                  system:
                    $ref: "#/components/schemas/SystemResponse"
            customerTransactionId:
              type: string
              description: Client maintained transaction id returned if present in request. Will only accept upper/lower case characters (a-z, A-Z), numerics (0-9), and hyphens (-)
              default: "435"
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            properties:
              errorCode:
                type: string
                description: ErrorCode that gets returned
                default: "EXP-400"
              errorType:
                type: string
                description: Specific error type
                default: Error Type
              message:
                type: string
                description: Specific error message
                default: Error Message
        success:
          type: boolean
          default: false
    ApplicantObjects:
      type: object
      required:
        - raw
      properties:
        raw:
          type: string
          description: Joint or Single applicant ARF data
          default: Raw Data
    SystemArray:
      type: array
      description: An array of system objects for a single request
      items:
        $ref: "#/components/schemas/SystemObject"
    SystemObject:
      type: object
      required:
        - systemName
      properties:
        systemName:
          type: string
          description: System to use for calculations. Will only accept upper/lower case characters (a-z, A-Z), numerics (0-9), and underscores (_)
          default: Demo:Demo_Attributes:Sample_Attributes
  securitySchemes:
    security_auth:
      type: oauth2
      flows:
        password:
          tokenUrl: https://sandbox-us-api.experian.com/oauth2/v1/token
          scopes:
            user: user scope
